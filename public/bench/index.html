<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Four point cloud rasterisers loading the same camera, frame by frame: voxelkloud (WebGPU and WebGL 2), Potree 1.8 and potree-core.">
<meta name="color-scheme" content="dark light">
</head>
<body>
<title>Convergence Race</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#0E1116; --surface:#161B22; --surface-2:#1C232D; --line:#252D38;
  --ink:#E4E9F0; --ink-2:#A8B3C2; --muted:#7E8A9B;
  --accent:#4FD1C5; --warn:#F0A868; --bad:#E06C75;
  --c-compute:#4FD1C5; --c-points:#7AA2F7; --c-instanced:#F0A868;
  --c-potree:#C0CAF5; --c-potreecore:#BB9AF7;
  --sans:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:40px 24px 80px;display:flex;flex-direction:column;gap:36px}
h1{font-size:30px;font-weight:600;letter-spacing:-.02em;margin:0;text-wrap:balance}
.sub{color:var(--ink-2);margin:0;max-width:66ch}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted);margin:0 0 8px}
.cond{display:flex;flex-wrap:wrap;gap:6px 20px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.cond b{color:var(--ink-2);font-weight:500}

/* ---- who is who ---- */
.who{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.card h3{margin:0 0 2px;font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
.card p{margin:6px 0 0;font-size:13.5px;color:var(--ink-2)}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.modes{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:9px}
.modes li{display:grid;grid-template-columns:auto 1fr;gap:9px;align-items:baseline;font-size:13.5px}
.modes code{font-family:var(--mono);font-size:12.5px;color:var(--ink)}
.modes .d{color:var(--ink-2)}
.tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  padding:1px 6px;border-radius:4px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.is-default{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.tag.is-fallback{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}

/* ---- scrubber ---- */
.scrub{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;
  display:flex;flex-direction:column;gap:10px;position:sticky;top:0;z-index:5}
.scrub-top{display:flex;justify-content:space-between;align-items:baseline;gap:16px}
.tnow{font-family:var(--mono);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent);height:22px}
.ticks{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;color:var(--muted)}

/* ---- panels ---- */
.group{display:flex;flex-direction:column;gap:12px}
/* The panels leave the text column: five side by side need more width than
   66ch of prose does. Centred by translation rather than negative margins,
   which is the version that survives being inside a flex column. */
.bleed{width:min(1560px,calc(100vw - 48px));position:relative;left:50%;transform:translateX(-50%)}
/* The RAIL scrolls, not the body. Five panels below ~1050px would otherwise
   push the whole page sideways. */
.rail{overflow-x:auto;padding-bottom:6px}
/* Column count and min-width are set from JS, off the arm count. */
.grid{display:grid;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;
  display:flex;flex-direction:column}
.panel-hd{display:flex;align-items:center;gap:8px;padding:11px 13px 9px}
.panel-hd .nm{font-family:var(--mono);font-size:13px;font-weight:500}
.panel-hd .eg{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
/* The family used to be a section heading. With one row it has to ride on the
   panel, or nothing on screen says which three are ours. */
.panel-fam{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  padding:7px 13px 0;color:var(--muted)}
.panel-fam.vk{color:var(--accent)}
.panel-hd{padding-top:4px}
.shot{display:block;width:100%;aspect-ratio:3/2;object-fit:cover;background:#000;border-block:1px solid var(--line)}
/* No frame recorded at this stop. Hatched and labelled, so it cannot be read as
   a renderer that drew nothing. */
.panel.nodata .shot{background:
  repeating-linear-gradient(45deg,#12171E 0 7px,#161C24 7px 14px)}
.panel.nodata{position:relative}
.panel.nodata .shot::after{content:""}
.panel.nodata::after{content:"no frame recorded";position:absolute;top:50%;left:0;right:0;
  transform:translateY(-50%);text-align:center;font-family:var(--mono);font-size:11px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--muted);pointer-events:none}
.readout{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line)}
.readout div{background:var(--surface);padding:8px 11px}
.readout .k{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.readout .v{font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums;margin-top:1px}

/* ---- chart + table ---- */
.chartbox{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
canvas{width:100%;height:260px;display:block}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:12px;font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.legend span{display:flex;align-items:center;gap:7px}
.tablebox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:10px 14px;text-align:right;font-family:var(--mono);font-size:13px;
  font-variant-numeric:tabular-nums;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
th:first-child,td:first-child{text-align:left}
tbody tr:last-child td{border-bottom:0}
td.best{color:var(--accent)}
td.bad{color:var(--warn)}
td.na{color:var(--muted)}
.notes{display:flex;flex-direction:column;gap:14px;max-width:70ch}
.note{border-left:2px solid var(--line);padding-left:14px}
.note b{display:block;font-size:13px;margin-bottom:2px}
.note p{margin:0;font-size:13.5px;color:var(--ink-2)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
<header>
  <p class="eyebrow">demo/bench-vitals &middot; 30 s capture</p>
  <h1>Convergence Race</h1>
  <p class="sub" id="sub"></p>
  <div class="cond" id="cond"></div>
</header>

<section class="group">
  <p class="eyebrow">who is who</p>
  <div class="who" id="who"></div>
</section>

<div class="scrub">
  <div class="scrub-top">
    <span class="eyebrow" style="margin:0">after load</span>
    <span class="tnow" id="tnow">—</span>
  </div>
  <input type="range" id="rng" min="0" max="13" value="3" step="1" aria-label="time after load">
  <div class="ticks" id="ticks"></div>
</div>

<section class="group bleed">
  <p class="eyebrow" id="eb-panels"></p>
  <div class="rail"><div class="grid" id="grid-all"></div></div>
</section>

<section class="group">
  <p class="eyebrow">distance to the final frame &middot; log scale</p>
  <div class="chartbox">
    <canvas id="chart"></canvas>
    <div class="legend" id="legend"></div>
  </div>
</section>

<section class="group">
  <p class="eyebrow">the numbers</p>
  <div class="tablebox"><table id="tbl"></table></div>
</section>

<section class="group">
  <p class="eyebrow">what these numbers do not say</p>
  <div class="notes" id="notes"></div>
</section>
</div>

<script>
const DATA = /*__DATA__*/null;
</script>
<script src="./app.js"></script>

</body>
</html>
